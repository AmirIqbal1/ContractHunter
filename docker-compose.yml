services:
  contracthunter:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /data
      REPOSITORY_DIR: /data/repositories
      DATABASE_PATH: /data/contracthunter.db
      GIT_CLONE_TIMEOUT_MS: 120000
      SLITHER_TIMEOUT_MS: 300000
      ADERYN_TIMEOUT_MS: 300000
      SCANNER_MAX_OUTPUT_BYTES: 20971520
      SOLC_INSTALL_TIMEOUT_MS: 120000
      MAX_SOLC_VERSIONS_PER_SCAN: 8
      ALLOW_COMPILER_DOWNLOADS: "true"
      TOOL_HOME_DIR: /data/tool-home
      DEPENDENCY_PREP_TIMEOUT_MS: 300000
      MAX_DEPENDENCY_OUTPUT_BYTES: 20971520
      MAX_SUBMODULE_DEPTH: 5
      MAX_SUBMODULES_PER_SCAN: 100
      ALLOW_NPM_DEPENDENCIES: "true"
      ALLOW_GIT_SUBMODULES: "true"
      ALLOWED_GIT_DEPENDENCY_HOSTS: github.com
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      AI_INPUT_COST_PER_MILLION_USD: ${AI_INPUT_COST_PER_MILLION_USD:-0.25}
      AI_OUTPUT_COST_PER_MILLION_USD: ${AI_OUTPUT_COST_PER_MILLION_USD:-2.00}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}
      AI_MAX_SOURCE_BYTES: ${AI_MAX_SOURCE_BYTES:-500000}
      AI_MAX_FILES: ${AI_MAX_FILES:-120}
      AI_MAX_FILE_BYTES: ${AI_MAX_FILE_BYTES:-75000}
      AI_REVIEW_MAX_SOURCE_BYTES: ${AI_REVIEW_MAX_SOURCE_BYTES:-300000}
      AI_REVIEW_MAX_FILES: ${AI_REVIEW_MAX_FILES:-80}
      AI_MAX_REVIEWERS: ${AI_MAX_REVIEWERS:-10}
      AI_REVIEW_CONCURRENCY: ${AI_REVIEW_CONCURRENCY:-2}
      AI_REVIEW_TIMEOUT_MS: ${AI_REVIEW_TIMEOUT_MS:-180000}
      AI_REVIEW_MAX_TOTAL_REQUESTS: ${AI_REVIEW_MAX_TOTAL_REQUESTS:-12}
      AI_VERIFICATION_PLAN_TIMEOUT_MS: ${AI_VERIFICATION_PLAN_TIMEOUT_MS:-120000}
      AI_VERIFICATION_PLAN_MAX_SOURCE_BYTES: ${AI_VERIFICATION_PLAN_MAX_SOURCE_BYTES:-120000}
      AI_VERIFICATION_PLAN_MAX_FILES: ${AI_VERIFICATION_PLAN_MAX_FILES:-12}
    volumes:
      - contracthunter-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  contracthunter-data:
